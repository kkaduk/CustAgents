pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    provider = "cluster"

    serialization-bindings {
      "com.bank.sa.agent.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 0
    }
  }

  cluster {
    jmx.multi-mbeans-in-same-jvm = on
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    sharding {
      number-of-shards = 100
      passivation {
        default-idle-strategy.idle-entity.timeout = 30m
      }
    }
  }

  persistence {
    # Default in-memory/local plugins for zero-dependency test/dev execution;
    # Override with -Dpekko.persistence.journal.plugin="jdbc-journal" and
    # -Dpekko.persistence.snapshot-store.plugin="jdbc-snapshot-store" on Oracle Exadata RAC.
    journal.plugin = "pekko.persistence.journal.inmem"
    snapshot-store.plugin = "pekko.persistence.snapshot-store.local"
    snapshot-store.local.dir = "target/snapshots"
  }
}

# =============================================================================
# ORACLE EXADATA PEKKO PERSISTENCE JDBC CONFIGURATION (Section 2, 3, 9, 11)
# Uses Slick OracleProfile targeting schema SA_PERSISTENCE on Oracle Exadata RAC
# =============================================================================
pekko-persistence-jdbc {
  shared-databases {
    oracle-exadata {
      profile = "slick.jdbc.OracleProfile$"
      db {
        host = "localhost"
        host = ${?ORACLE_EXADATA_HOST}
        port = 1521
        port = ${?ORACLE_EXADATA_PORT}
        serviceName = "FREEPDB1"
        serviceName = ${?ORACLE_EXADATA_SERVICE}
        url = "jdbc:oracle:thin:@//"${pekko-persistence-jdbc.shared-databases.oracle-exadata.db.host}":"${pekko-persistence-jdbc.shared-databases.oracle-exadata.db.port}"/"${pekko-persistence-jdbc.shared-databases.oracle-exadata.db.serviceName}
        driver = "oracle.jdbc.OracleDriver"
        user = "SA_PERSISTENCE"
        user = ${?ORACLE_EXADATA_USER}
        password = "Exadata_SA_Persist_2026"
        password = ${?ORACLE_EXADATA_PASSWORD}
        numThreads = 16
        maxConnections = 32
        minConnections = 4
      }
    }
  }
}

jdbc-journal {
  use-shared-db = "oracle-exadata"
  tables {
    event_journal {
      tableName = "EVENT_JOURNAL"
      schemaName = "SA_PERSISTENCE"
    }
    event_tag {
      tableName = "EVENT_TAG"
      schemaName = "SA_PERSISTENCE"
    }
  }
}

jdbc-snapshot-store {
  use-shared-db = "oracle-exadata"
  tables {
    snapshot {
      tableName = "SNAPSHOT"
      schemaName = "SA_PERSISTENCE"
    }
  }
}

jdbc-durable-state-store {
  use-shared-db = "oracle-exadata"
  tables {
    durable_state {
      tableName = "DURABLE_STATE"
      schemaName = "SA_PERSISTENCE"
    }
  }
}

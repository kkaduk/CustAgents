services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: sa-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 16

  flink-jobmanager:
    image: flink:1.19.1-java21
    container_name: sa-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    image: flink:1.19.1-java21
    container_name: sa-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  oracle-exadata:
    image: gvenzl/oracle-free:23-slim
    container_name: sa-oracle-exadata
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Exadata_SA_Root_2026
      APP_USER: SA_PERSISTENCE
      APP_USER_PASSWORD: Exadata_SA_Persist_2026
    volumes:
      - ./sql/oracle_exadata_schemas.sql:/container-entrypoint-initdb.d/01_oracle_exadata_schemas.sql:ro
